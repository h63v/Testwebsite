<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta
    name="theme-color"
    content="#8b5cf6">

  <title>
    Solo Leveling - الفصل 210
  </title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #08080b;
      color: white;

      font-family:
        Arial,
        Tahoma,
        sans-serif;
    }


    /* HEADER */

    .reader-header {
      position: sticky;

      top: 0;

      z-index: 100;

      height: 65px;

      background:
        rgba(15,15,20,.96);

      backdrop-filter:
        blur(15px);

      border-bottom:
        1px solid #292936;

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      padding:
        0 5%;
    }

    .reader-header a {
      color: white;

      text-decoration: none;
    }

    .logo {
      font-size: 22px;

      font-weight: bold;
    }

    .logo span {
      color:
        #8b5cf6;
    }

    .chapter {
      color: #aaa;

      font-size: 14px;
    }


    /* READER */

    .reader {
      max-width: 900px;

      margin: auto;
    }

    .page {
      width: 100%;

      display: block;

      margin: auto;
    }


    /* CONTROLS */

    .controls {
      padding:
        30px 15px;

      display: flex;

      justify-content:
        center;

      gap: 10px;
    }

    .controls a,
    .controls button {

      border:
        1px solid #292936;

      background:
        #15151d;

      color: white;

      padding:
        12px 20px;

      border-radius: 8px;

      cursor: pointer;

      text-decoration: none;

      font-size: 13px;

    }

    .controls a:hover,
    .controls button:hover {

      background:
        #8b5cf6;

      border-color:
        #8b5cf6;

    }


    /* MOBILE */

    @media (max-width: 600px) {

      .chapter {
        font-size: 11px;
      }

      .controls {
        flex-direction:
          column;
      }

      .controls a,
      .controls button {
        width: 100%;

        text-align: center;
      }

    }

  </style>

</head>


<body>


  <!-- HEADER -->

  <header class="reader-header">

    <a
      href="index.html"
      class="logo">

      Manga<span>X</span>

    </a>


    <div class="chapter">

      Solo Leveling
      —
      الفصل 210

    </div>


    <a href="index.html">

      ✕

    </a>

  </header>


  <!-- READER -->

  <main class="reader">


    <!-- صفحة 1 -->

    <img
      class="page"
      src="https://picsum.photos/900/1300?random=101"
      alt="صفحة 1">


    <!-- صفحة 2 -->

    <img
      class="page"
      src="https://picsum.photos/900/1300?random=102"
      alt="صفحة 2">


    <!-- صفحة 3 -->

    <img
      class="page"
      src="https://picsum.photos/900/1300?random=103"
      alt="صفحة 3">


    <!-- صفحة 4 -->

    <img
      class="page"
      src="https://picsum.photos/900/1300?random=104"
      alt="صفحة 4">


    <!-- CONTROLS -->

    <div class="controls">

      <a href="#">
        ← الفصل السابق
      </a>

      <button
        onclick="window.scrollTo({
          top: 0,
          behavior: 'smooth'
        })">

        ↑ أعلى الصفحة

      </button>

      <a href="#">
        الفصل التالي →
      </a>

    </div>


  </main>


</body>

</html>
